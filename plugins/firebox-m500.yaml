name: firebox-m500
description: "WatchGuard Firebox M500 (Lanner FW-7585, x86_64) — halt GRUB autoboot so user can edit. Target: OpenWrt x86_64 via USB or shell drop via init=/bin/sh."

vars: {}

# M500 has CLEAN serial (no garble) and standard GRUB Legacy 0.97 on x86.
# We halt the autoboot countdown by sending a Down arrow as soon as we see
# the GRUB banner — the menu then stays interactive indefinitely for the user.
triggers:
  # Observer only — user drives the menu manually from the keys pane.
  - id: GRUB_BANNER
    pattern: "re:GNU GRUB"
    action: { send: "" }
    debounce: 600

  # Observer
  - id: GRUB_PROMPT
    pattern: "grub>"
    action: { send: "" }
    debounce: 60
