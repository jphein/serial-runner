name: firebox-t20-openwrt
description: >
  WatchGuard Firebox T20 running OpenWrt 25.12.4. The T20 boots autonomously
  from eMMC after a one-time SPI NOR mod (see openwrt-patches/ and
  flash-t20.sh in the watchguard project). This plugin watches the live
  boot: U-Boot loads the non-initramfs kernel + DTB from /dev/mmcblk0p3,
  hands off to bootm with bootargs that tell the kernel to mount squashfs
  from /dev/mmcblk0p7. mount_root sets up an F2FS overlay in the unused
  tail of p7. Plugin auto-logs in at the login prompt and runs optional
  bootstrap steps (set hostname/password, check overlay).

vars:
  # Default password baked into the image's banner instructions — override
  # with `--var root_password=...` for production deployments.
  root_password: "openwrt-t20"
  hostname: "Firebox-T20"

triggers:
  # ----- U-Boot phase (informational) -----
  # WG's modified U-Boot autoboots via wgBootSysA and is not interruptible
  # under our current NOR patch. These triggers just log progress.

  - id: UBOOT_BANNER
    pattern: "re:U-Boot 20[0-9]{2}"
    action: { send: "" }      # no-op: just mark in log
    debounce: 30

  - id: KERNEL_LOAD
    pattern: "re:Loading Kernel Image"
    action: { send: "" }
    debounce: 30

  # ----- Linux boot phase -----

  - id: KERNEL_BANNER
    pattern: "re:Linux version [0-9]+\\.[0-9]+"
    action: { send: "" }
    debounce: 30

  # mount_root finishing — overlay should now be live
  - id: OVERLAY_UP
    pattern: "re:mount_root: switching to .* overlay|overlayfs:.* type overlay"
    action: { send: "" }
    debounce: 30

  - id: PROCD_READY
    pattern: "re:procd: - init|Please press Enter to activate this console"
    action: { send: "\r" }
    debounce: 600

  # ----- OpenWrt userland phase -----

  # Auto-login at the login prompt (only fires if dropbear/getty asks)
  - id: LOGIN_PROMPT
    pattern: "re:T20 login:|OpenWrt login:|Firebox-T20 login:"
    action: { send: "root\r" }
    debounce: 30

  - id: PASSWORD_PROMPT
    pattern: "re:Password:"
    action: { send: "${root_password}\r" }
    debounce: 30

  # Reached an interactive shell on the unconfigured image (hostname still
  # OpenWrt — likely a fresh deploy that hasn't restored config yet).
  - id: OPENWRT_SHELL_FRESH
    pattern: 're:root@OpenWrt:[~/]+ ?#'
    action: { send: "" }
    debounce: 600

  # Reached the configured shell — normal post-bootstrap state.
  - id: T20_SHELL
    pattern: 're:root@Firebox-T20:[~/]+ ?#'
    action: { send: "" }
    debounce: 600

  # ----- Recovery / unexpected -----

  # Kernel panic — surface it
  - id: KERNEL_PANIC
    pattern: "re:Kernel panic - not syncing"
    action: { send: "" }
    debounce: 600

  # SError — usually means DTS/IFC mismatch; should not happen on the patched DTB
  - id: SERROR
    pattern: "re:SError Interrupt"
    action: { send: "" }
    debounce: 600

# Optional one-shot bootstrap. Runs after a fresh OpenWrt shell is reached
# (e.g. after the squashfs has just been deployed and overlay is empty).
# These commands are idempotent — safe to re-run on an already-bootstrapped box.
steps:
  - wait_for: 're:root@(OpenWrt|Firebox-T20):[~/]+ ?#'
    timeout: 600

  # Set hostname
  - send: "uci set system.@system[0].hostname=${hostname}\r"
  - send: "uci commit system && /etc/init.d/system reload\r"

  # Set root password
  - send: "echo 'root:${root_password}' | chpasswd\r"

  # Verify overlay is live
  - send: "mount | grep -E 'overlay|/rom' | head -2\r"
  - send: "df -h /overlay\r"

  # Mark bootstrap done
  - send: "echo 'T20 OpenWrt ready' > /tmp/bootstrap-complete\r"
